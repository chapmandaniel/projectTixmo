name: Temporary API dependency audit remediation
on:
  push:
    branches: [codex/merge-dependency-audit-20261025]
    paths: [.github/workflows/merge-dependency-audit-20261025.yml]
permissions:
  contents: write
jobs:
  repair-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/merge-dependency-audit-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Resolve targeted compatible security releases without lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts --prefix tixmoapi2 'multer@^2.5.0' 'nodemailer@^10.1.4'
          npm update --package-lock-only --ignore-scripts --prefix tixmoapi2 body-parser
      - name: Enforce clean complete API audit
        run: npm --prefix tixmoapi2 audit
      - name: Check generated dependency diff and record resolved versions
        run: |
          git diff --check
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('tixmoapi2/package-lock.json'));
          const floors = {'body-parser':'1.20.9','multer':'2.5.0','nodemailer':'10.1.4'};
          for (const [name, floor] of Object.entries(floors)) {
            const entries = Object.entries(lock.packages).filter(([p]) => p.endsWith('/node_modules/'+name) || p === 'node_modules/'+name);
            if (!entries.length) throw Error('Missing package '+name);
            for (const [location, pkg] of entries) {
              if (!/^\d+\.\d+\.\d+$/.test(pkg.version) || pkg.version.localeCompare(floor, 'en', {numeric:true}) < 0) throw Error('Vulnerable lock entry '+location);
              console.log(location, pkg.version, pkg.integrity);
            }
          }
          NODE
          test "$(git diff --name-only | grep -vE '^tixmoapi2/package(-lock)?\.json$' | wc -l)" -eq 0
      - name: Commit only API dependency files to owned branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tixmoapi2/package.json tixmoapi2/package-lock.json
          git -c core.hooksPath=/dev/null commit -m 'fix: update vulnerable API parser upload and mail dependencies'
          git push origin HEAD:codex/merge-dependency-audit-20261025
          git rev-parse HEAD > /tmp/dependency-remediation-head.txt
      - name: Upload lockfiles and result commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dependency-remediation
          path: |
            tixmoapi2/package.json
            tixmoapi2/package-lock.json
            /tmp/dependency-remediation-head.txt
          if-no-files-found: error
