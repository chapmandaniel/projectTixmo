name: Brand checker

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'brand-checker/**'
      - '.github/workflows/brand-checker.yml'
  push:
    branches:
      - main
    paths:
      - 'brand-checker/**'
      - '.github/workflows/brand-checker.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brand-checker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: brand-checker/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
