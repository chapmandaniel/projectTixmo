name: Brand checker

on:
  pull_request:
    paths:
      - 'brand-checker/**'
      - '.github/workflows/brand-checker.yml'
  push:
    branches:
      - main
    paths:
      - 'brand-checker/**'
      - '.github/workflows/brand-checker.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brand-checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: brand-checker/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
