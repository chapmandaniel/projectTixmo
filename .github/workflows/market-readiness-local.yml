name: Tixmo Market Readiness Local Gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/market-readiness-local.yml'
      - 'package.json'
      - 'scripts/**'
      - 'tdash/**'
      - 'tixmoapi2/**'
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/market-readiness-local.yml'
      - 'package.json'
      - 'scripts/**'
      - 'tdash/**'
      - 'tixmoapi2/**'

jobs:
  local-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Job-scoped services are removed with the job; no shared names or volumes.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: tixmo_ci
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: tixmo_disposable_ci
        ports:
          - '127.0.0.1::5432'
        options: >-
          --health-cmd "pg_isready -U tixmo_ci -d tixmo_disposable_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - '127.0.0.1::6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      JWT_SECRET: ci_jwt_secret_32_chars_minimum_value
      JWT_REFRESH_SECRET: ci_refresh_secret_32_chars_minimum
      SESSION_SECRET: ci_session_secret_32_chars_minimum
      STRIPE_SECRET_KEY: sk_test_market_readiness
      STRIPE_WEBHOOK_SECRET: whsec_market_readiness
      PAYMENT_CURRENCY: cad
      ADMIN_EMAIL: ci-admin@tixmo.test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            tixmoapi2/package-lock.json
            tdash/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix tixmoapi2

      - name: Install dashboard dependencies
        run: npm ci --prefix tdash

      - name: Verify populated migration upgrade
        # Reuse only this job's disposable loopback services; no inherited app target.
        env:
          TIXMO_ALLOW_TEST_RESET: 'true'
          DATABASE_URL: postgresql://tixmo_ci:synthetic_ci_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tixmo_disposable_ci?schema=public
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/1
        run: |
          npm --prefix tixmoapi2 run build
          TIXMO_TEST_DATABASE_URL="$DATABASE_URL" node scripts/verify-payment-upgrade.cjs

      - name: Require existing system Chrome for buyer continuity acceptance
        run: |
          node scripts/wallet-browser.test.cjs
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version

      - name: Prepare fresh aggregate-only HTTP pressure evidence
        run: |
          node --test scripts/http-pressure-receipt.test.cjs
          node scripts/http-pressure-receipt.cjs clear
          node --test scripts/http-ramp-receipt.test.cjs
          node scripts/http-ramp-receipt.cjs clear
          node --test scripts/native-recovery-receipt.test.cjs
          node scripts/native-recovery-receipt.cjs clear
          node --test scripts/payment-http-receipt.test.cjs
          node scripts/payment-http-receipt.cjs clear
          node --test scripts/scanner-browser.test.cjs
          node scripts/scanner-browser-guard.cjs clear

      - name: Run market readiness gates
        id: market
        # job.services is available at step scope, not jobs.<job_id>.env.
        env:
          TIXMO_ALLOW_DESTRUCTIVE_TESTS: '1'
          TIXMO_PRESSURE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIXMO_PRESSURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TIXMO_PAID_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIXMO_PAID_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TIXMO_SCANNER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIXMO_SCANNER_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TIXMO_RECOVERY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIXMO_RECOVERY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TIXMO_RAMP_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIXMO_RAMP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          TIXMO_BROWSER_PATH: /usr/bin/google-chrome
          DATABASE_URL: postgresql://tixmo_ci:synthetic_ci_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tixmo_disposable_ci?schema=public
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/1
        run: npm run verify:market

      - name: Report validated current-run HTTP pressure aggregates
        if: ${{ !cancelled() && (steps.market.outcome == 'success' || steps.market.outcome == 'failure') }}
        env:
          TIXMO_PRESSURE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIXMO_PRESSURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/http-pressure-receipt.cjs report

      - name: Report validated current-run HTTP actor ramp aggregates
        if: ${{ !cancelled() && (steps.market.outcome == 'success' || steps.market.outcome == 'failure') }}
        env:
          TIXMO_RAMP_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIXMO_RAMP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/http-ramp-receipt.cjs report

      - name: Report current-run native scheduled recovery aggregates
        if: ${{ !cancelled() && (steps.market.outcome == 'success' || steps.market.outcome == 'failure') }}
        env:
          TIXMO_RECOVERY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIXMO_RECOVERY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/native-recovery-receipt.cjs report

      - name: Report synthetic mounted payment application latency
        if: ${{ !cancelled() && (steps.market.outcome == 'success' || steps.market.outcome == 'failure') }}
        env:
          TIXMO_PAID_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIXMO_PAID_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/payment-http-receipt.cjs report

      - name: Report current-run emulated scanner browser aggregates
        if: ${{ !cancelled() && (steps.market.outcome == 'success' || steps.market.outcome == 'failure') }}
        env:
          TIXMO_SCANNER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIXMO_SCANNER_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/scanner-browser-guard.cjs report

  configured-image-restore:
    # Separate job-owned services: never the existing gate DB or a target backup.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:18
        env:
          POSTGRES_USER: tixmo_restore_ci
          POSTGRES_PASSWORD: synthetic_restore_password
          POSTGRES_DB: tixmo_disposable_restore_source
          PGDATA: /var/lib/postgresql/data/pgdata
        ports:
          - '127.0.0.1::5432'
        options: >-
          --health-cmd "pg_isready -U tixmo_restore_ci -d tixmo_disposable_restore_source"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2.9
        ports:
          - '127.0.0.1::6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: tixmoapi2/package-lock.json
      - name: Install isolated API tools
        run: npm ci --prefix tixmoapi2
      - name: Check synthetic restore guards
        run: node --test scripts/image-restore.test.cjs scripts/application-rollback.test.cjs scripts/parity-upgrade.test.cjs scripts/auth-ip.test.cjs
      - name: Qualify configured images with synthetic new-database restore
        env:
          TIXMO_IMAGE_RESTORE: synthetic-only
          PG_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
          DATABASE_URL: postgresql://tixmo_restore_ci:synthetic_restore_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tixmo_disposable_restore_source?schema=public
        run: node scripts/verify-image-restore.cjs
      - name: Build actual production image with matching PostgreSQL 18 clients
        run: docker build --tag tixmo-task603-production:ci tixmoapi2
      - name: Qualify packaged snapshot roundtrip against only this job's synthetic source
        env:
          DATABASE_URL: postgresql://tixmo_restore_ci:synthetic_restore_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tixmo_disposable_restore_source?schema=public
        run: |
          set -euo pipefail
          umask 077
          receipt_file=$(mktemp)
          error_file=$(mktemp)
          owned_container=''
          cleanup() {
            if [[ "$owned_container" =~ ^[a-f0-9]{64}$ ]]; then
              docker rm --force "$owned_container" >/dev/null 2>&1 || true
            fi
            rm -f "$receipt_file" "$error_file"
          }
          trap cleanup EXIT
          owned_container=$(docker create --network host --env DATABASE_URL --env NODE_ENV=production --env GITHUB_ACTIONS=true --env TIXMO_BACKUP_CI=synthetic-only --env TIXMO_BACKUP_REHEARSAL=true --entrypoint node tixmo-task603-production:ci scripts/backup-rehearsal.cjs)
          [[ "$owned_container" =~ ^[a-f0-9]{64}$ ]]
          docker start --attach "$owned_container" >"$receipt_file" 2>"$error_file"
          node - "$receipt_file" "$error_file" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { MIGRATION_COUNT } = require('./tixmoapi2/scripts/migration-census.cjs');
          assert.equal(fs.statSync(process.argv[3]).size, 0, 'Packaged roundtrip emitted unexpected diagnostics');
          let result;
          try { result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')); } catch { throw new Error('Packaged roundtrip receipt malformed'); }
          const phases = ['guard','clients','workspace','snapshot','dump','create','restore','compare','deadline'];
          console.log(JSON.stringify({scope:'synthetic-packaged-task603',phase:phases.includes(result.phase)?result.phase:'unclassified',ok:result.ok===true,dumpComplete:result.dumpComplete===true,snapshotRowsMatch:result.snapshotRowsMatch===true,databaseCleanupVerified:result.databaseCleanupVerified===true,archiveCleanupVerified:result.archiveCleanupVerified===true,possibleDatabaseOrphan:result.possibleDatabaseOrphan===true}));
          assert.equal(result.scope, 'task603-snapshot-logical-roundtrip');
          for (const field of ['ok', 'dumpComplete', 'snapshotRowsMatch', 'databaseCleanupVerified', 'archiveCleanupVerified']) assert.equal(result[field], true, 'Packaged roundtrip incomplete');
          assert.equal(result.migrations, MIGRATION_COUNT);
          assert.ok(result.tableCount >= 33);
          assert.equal(result.possibleDatabaseOrphan, false);
          console.log(JSON.stringify({scope:'synthetic-packaged-task603',ok:true,migrations:result.migrations,tableCount:result.tableCount,rowCount:result.rowCount,durationMs:result.durationMs}));
          NODE
          docker rm "$owned_container" >/dev/null
          ! docker inspect "$owned_container" >/dev/null 2>&1
          owned_container=''
      - name: Checkout exact qualified rollback API source
        uses: actions/checkout@v4
        with:
          ref: 07363acd05d8a49bcec74f7a2011b1dbedd50fde
          path: .rollback-old
          persist-credentials: false
      - name: Verify database parity and exact reviewed application rollback contract
        run: node -e "const p=require('./scripts/verify-application-rollback.cjs');p.parity('tixmoapi2','.rollback-old/tixmoapi2')"
      - name: Build exact previously qualified API image
        run: docker build --tag tixmo-task606-old:ci .rollback-old/tixmoapi2
      - name: Qualify new-old-new mounted applications on retained migrated database
        env:
          GITHUB_ACTIONS: 'true'
          TIXMO_APPLICATION_ROLLBACK: synthetic-only
          DATABASE_URL: postgresql://tixmo_restore_ci:synthetic_restore_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tixmo_disposable_restore_source?schema=public
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/6
        run: node scripts/verify-application-rollback.cjs
      - name: Qualify populated prior-schema upgrade on configured images
        env:
          GITHUB_ACTIONS: 'true'
          TIXMO_POPULATED_PARITY: synthetic-only
          PG_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
          DATABASE_URL: postgresql://tixmo_restore_ci:synthetic_restore_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tixmo_disposable_restore_source?schema=public
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/7
        run: node scripts/verify-parity-upgrade.cjs
      - name: Measure unchanged production auth shared-IP limits on disposable services
        env:
          GITHUB_ACTIONS: "true"
          TIXMO_AUTH_IP: synthetic-only
          PG_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
          DATABASE_URL: postgresql://tixmo_restore_ci:synthetic_restore_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tixmo_disposable_restore_source?schema=public
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/8
          TIXMO_AUTH_IP_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TIXMO_AUTH_IP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/verify-auth-ip.cjs
      - name: Remove only owned compatibility containers and anonymous volumes
        if: always()
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          [[ "$PG_CONTAINER" =~ ^[a-f0-9]{64}$ && "$REDIS_CONTAINER" =~ ^[a-f0-9]{64}$ && "$PG_CONTAINER" != "$REDIS_CONTAINER" ]]
          docker rm --force --volumes "$PG_CONTAINER" "$REDIS_CONTAINER"
          ! docker inspect "$PG_CONTAINER" "$REDIS_CONTAINER" >/dev/null 2>&1
        # GitHub also tears down this job's service network on success/failure/cancellation.
