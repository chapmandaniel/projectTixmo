[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["/bin/sh -c 'if [ \"$TIXMO_ASSET_SHARE_REKEY_ONCE\" = true ]; then TIXMO_ASSET_REKEY_DATABASE_URL=\"$DATABASE_URL\" node prisma/rekey-asset-shares.js --preserve-hash-only --apply; fi'"]
startCommand = "/bin/sh -c 'npm run migrate && if [ \"$TIXMO_ASSET_SHARE_AUDIT_ON_START\" = true ]; then if [ \"$TIXMO_ASSET_SHARE_AUDIT_PRESERVE_HASH_ONLY_ON_START\" = true ]; then TIXMO_ASSET_REKEY_DATABASE_URL=\"$DATABASE_URL\" node prisma/rekey-asset-shares.js --preserve-hash-only; else TIXMO_ASSET_REKEY_DATABASE_URL=\"$DATABASE_URL\" node prisma/rekey-asset-shares.js; fi; fi && if [ \"$TIXMO_STRIPE_READ_PROBE\" = true ]; then node scripts/stripe-read-probe.cjs; fi && if [ \"$TIXMO_ASSET_LINK_CHECK_ON_START\" = true ]; then TIXMO_ASSET_REKEY_DATABASE_URL=\"$DATABASE_URL\" node prisma/check-asset-share-links.js; fi && if [ \"$TIXMO_RUNTIME_VERSION_PROBE\" = true ]; then node scripts/runtime-version-probe.cjs; fi && exec node dist/index.js'"
healthcheckPath = "/ready"
restartPolicyType = "ON_FAILURE"
