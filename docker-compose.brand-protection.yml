name: tixmo-brand-local

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: tixmo
      POSTGRES_PASSWORD: tixmo_local_only
      POSTGRES_DB: tixmo_disposable_brandcheck
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tixmo -d tixmo_disposable_brandcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - tixmo_brand_local_pg:/var/lib/postgresql/data

volumes:
  tixmo_brand_local_pg:
